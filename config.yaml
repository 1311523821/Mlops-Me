# ============================================================
# MLOps 工作流 — 全局配置（所有任务共享）
# 每个任务自己的默认参数在 tasks/<task>/config.yaml
# ============================================================

# ---------- 项目元信息 ----------
project:
  name: "mlops-workflow"       # MLflow 实验名
  description: "通用深度学习工作流"
  tags:
    framework: "pytorch"
    owner: "default"

# ---------- 路径配置 ----------
paths:
  data_dir: "./data"           # 数据集存放目录
  output_dir: "./outputs"      # 模型、图表、ONNX 的输出根目录
  mlflow_uri: "sqlite:///mlflow.db"  # MLflow 追踪数据库

# ---------- 设备配置 ----------
device:
  gpu_id: 0
  use_cuda: true

# ---------- 训练超参数默认值 ----------
training:
  learning_rate: 0.001
  optimizer: "adam"            # adam | sgd
  weight_decay: 0.0001
  early_stopping_patience: 10

# ---------- ONNX 导出 ----------
export:
  onnx_opset: 14
